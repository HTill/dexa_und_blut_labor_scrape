<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEXA & Blutlabor Karte — DACH</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="controls">
    <h1>DEXA & Blutlabor Karte</h1>
    <div id="filters">
      <button class="filter-btn active" data-filter="alle">Alle</button>
      <button class="filter-btn" data-filter="dexa">DEXA</button>
      <button class="filter-btn" data-filter="blutlabor">Blutlabor</button>
    </div>
    <div id="stats"></div>
  </div>

  <div id="map"></div>

  <div id="detail-panel">
    <div id="detail-close">×</div>
    <div id="detail-content"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
